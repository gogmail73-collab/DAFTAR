name: Build DAFTAR Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'redesign/**']
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'vendor/**'
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'android/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      DAFTAR_SIGNING_CONFIGURED: ${{ secrets.DAFTAR_KEYSTORE_BASE64 != '' && secrets.DAFTAR_STORE_PASSWORD != '' && secrets.DAFTAR_KEY_ALIAS != '' && secrets.DAFTAR_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DAFTAR-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare existing release signing key
        if: ${{ env.DAFTAR_SIGNING_CONFIGURED == 'true' }}
        env:
          DAFTAR_KEYSTORE_BASE64: ${{ secrets.DAFTAR_KEYSTORE_BASE64 }}
        run: |
          echo "$DAFTAR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daftar-release.jks"
          test -s "$RUNNER_TEMP/daftar-release.jks"
          echo "DAFTAR_KEYSTORE_PATH=$RUNNER_TEMP/daftar-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.DAFTAR_SIGNING_CONFIGURED == 'true' }}
        env:
          DAFTAR_STORE_PASSWORD: ${{ secrets.DAFTAR_STORE_PASSWORD }}
          DAFTAR_KEY_ALIAS: ${{ secrets.DAFTAR_KEY_ALIAS }}
          DAFTAR_KEY_PASSWORD: ${{ secrets.DAFTAR_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature
        if: ${{ env.DAFTAR_SIGNING_CONFIGURED == 'true' }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload signed release APK
        if: ${{ env.DAFTAR_SIGNING_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: DAFTAR-Android-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
