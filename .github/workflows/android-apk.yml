name: Build DAFTAR Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'redesign/**']
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'android/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check signing secrets
        env:
          DAFTAR_KEYSTORE_BASE64: ${{ secrets.DAFTAR_KEYSTORE_BASE64 }}
          DAFTAR_STORE_PASSWORD: ${{ secrets.DAFTAR_STORE_PASSWORD }}
          DAFTAR_KEY_ALIAS: ${{ secrets.DAFTAR_KEY_ALIAS }}
          DAFTAR_KEY_PASSWORD: ${{ secrets.DAFTAR_KEY_PASSWORD }}
        run: |
          test -n "$DAFTAR_KEYSTORE_BASE64" || (echo "Missing GitHub secret: DAFTAR_KEYSTORE_BASE64" && exit 1)
          test -n "$DAFTAR_STORE_PASSWORD" || (echo "Missing GitHub secret: DAFTAR_STORE_PASSWORD" && exit 1)
          test -n "$DAFTAR_KEY_ALIAS" || (echo "Missing GitHub secret: DAFTAR_KEY_ALIAS" && exit 1)
          test -n "$DAFTAR_KEY_PASSWORD" || (echo "Missing GitHub secret: DAFTAR_KEY_PASSWORD" && exit 1)
          echo "$DAFTAR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daftar-release.jks"
          echo "DAFTAR_KEYSTORE_PATH=$RUNNER_TEMP/daftar-release.jks" >> "$GITHUB_ENV"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Build signed release APK
        env:
          DAFTAR_STORE_PASSWORD: ${{ secrets.DAFTAR_STORE_PASSWORD }}
          DAFTAR_KEY_ALIAS: ${{ secrets.DAFTAR_KEY_ALIAS }}
          DAFTAR_KEY_PASSWORD: ${{ secrets.DAFTAR_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAFTAR-Android-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
