name: Validate and deploy DAFTAR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s sw.js
          test -s manifest.webmanifest
          test -s icon.svg
      - name: Check offline shell has no remote dependencies
        run: |
          if grep -En 'https?://|@import[[:space:]]+url' index.html styles.css app.js; then
            echo "Unexpected remote dependency in app shell"
            exit 1
          fi
  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html styles.css app.js sw.js manifest.webmanifest icon.svg dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
