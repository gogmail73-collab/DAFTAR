plugins { id 'com.android.application' }

android {
    namespace 'com.daftar.study'
    compileSdk 35
    defaultConfig {
        applicationId 'com.daftar.study'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('copyWebAssets', Copy) {
    from('../') {
        include 'index.html', 'styles.css', 'app.js', 'icon.svg', 'manifest.webmanifest'
    }
    into('src/main/assets/www')
}
preBuild.dependsOn copyWebAssets
